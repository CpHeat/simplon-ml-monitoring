global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2

rule_files:
  - 'alerts.yml'
    
scrape_configs:
- job_name: prometheus
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - localhost:9090
- job_name: 'cadvisor'
  static_configs:
    - targets: ['cadvisor:8080']
- job_name: 'fastapi'
  static_configs:
    - targets: ['fastapi:8000']
  metrics_path: '/metrics'
- job_name: 'drift-monitor'
  static_configs:
    - targets: ['drift-monitor:8002']
  metrics_path: '/metrics'
  scrape_interval: 60s  # Scrape toutes les minutes (drift change lentement)